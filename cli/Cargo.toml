[package]
name = "super-cli"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "super_cli"
path = "src/lib.rs"

[[bin]]
name = "super"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
ratatui = "0.28"
crossterm = "0.28"
rig-core = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "stream"] }
dirs = "5"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
regex = "1"
glob = "0.3"
html2md = "0.2"
walkdir = "2"
notify = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
webbrowser = "0.8"
async-trait = "0.1"
pathdiff = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
similar = "2"
lsp-types = "0.97"
lsp-server = "0.7"
crossbeam-channel = "0.5"
which = "7"
jsonschema = "0.46"
