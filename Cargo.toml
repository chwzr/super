[workspace]
resolver = "2"
members = [
    "crates/super-bench",
    "crates/super-ai",
    "crates/super-agent",
    "crates/super-coding",
    "crates/super-mcp",
    "crates/super-tui",
    "crates/super",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/chwzr/super"

[workspace.metadata.pi]
repository = "earendil-works/pi"
release = "v0.84.3"
release_commit = "4e58f324fae8ebfa98a3d45181fb248072a2afac"
release_published_at = "2026-08-24T10:50:48Z"
parity_commit = "4e58f324fae8ebfa98a3d45181fb248072a2afac"
parity_checked_at = "2026-08-26T03:44:00Z"
catalog_package = "@earendil-works/pi-ai@0.84.3"

[workspace.dependencies]
super-ai = { path = "crates/super-ai" }
super-agent = { path = "crates/super-agent" }
super-coding = { path = "crates/super-coding" }
super-mcp = { path = "crates/super-mcp" }
super-tui = { path = "crates/super-tui" }
super-bench = { path = "crates/super-bench" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "fs", "net"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "rustls-tls-native-roots-no-provider", "system-proxy"] }
reqwest-mcp = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "stream", "rustls-no-provider", "system-proxy"] }
http = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
dirs = "6"
regex = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
jsonschema = { version = "0.33", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
mermaid-text = "0.57"
mdwright-latex = "0.1.3"
libc = "0.2"
fs2 = "0.4"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
similar = "2"
async-trait = "0.1"
base64 = "0.22"
serde_yaml = "0.9"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
url = "2"
rpassword = "7"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
aws-config = { version = "1.10", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1.139", features = ["behavior-version-latest"] }
aws-smithy-types = "1.6"
rmcp = { version = "3.1.4", default-features = false, features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
