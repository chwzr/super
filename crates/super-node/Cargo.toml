# Kept outside the root workspace: this package needs a Node-compatible N-API
# runtime, which must not become a prerequisite for `cargo test --workspace`.
[workspace]

[package]
name = "super-node"
version = "0.0.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/chwzr/super"
description = "N-API bindings for the super coding agent SDK"

[lib]
crate-type = ["cdylib"]

[features]
default = ["mock"]
mock = ["super-sdk/mock"]

[dependencies]
super-sdk = { path = "../super-sdk", features = ["rpc"] }
napi = { version = "3", features = ["napi9", "tokio_rt"] }
napi-derive = "3"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
