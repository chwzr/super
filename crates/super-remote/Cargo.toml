[package]
name = "super-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Remote control for SUPER sessions: mirrors the RPC protocol to S2 streams"

[lints]
workspace = true

[features]
# An in-memory platform (the S2 proxy and the registry endpoints) for tests of
# this crate and of crates that build on it.
fake = []

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
super-ai = { workspace = true, features = ["native"] }
super-sdk = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
super-remote = { path = ".", features = ["fake"] }
super-sdk = { workspace = true, features = ["mock"] }
super-coding = { workspace = true }
tempfile = { workspace = true }
