# This crate is deliberately NOT a member of the root Cargo workspace. Building
# a PyO3 crate's test harness links libpython, which is not present on every
# machine that runs `cargo test --workspace`. The empty `[workspace]` table below
# stops Cargo from walking up to the root manifest.
[workspace]

[package]
name = "super-py"
version = "0.0.12"
edition = "2024"
license = "MIT"
repository = "https://github.com/chwzr/super"
description = "Python bindings for the super coding agent SDK"

[lib]
name = "_super"
crate-type = ["cdylib"]

[features]
# The scripted offline provider. On by default so `python -m super_sdk.demo`
# works with no API key; turn it off for a slimmer wheel.
default = ["mock"]
mock = ["super-sdk/mock"]

[dependencies]
super-sdk = { path = "../super-sdk", features = ["rpc"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
