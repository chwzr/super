# Browser-local agent kernel. Deliberately outside the native root workspace.
[workspace]

[package]
name = "super-core-wasm"
version = "0.0.36"
edition = "2024"
license = "MIT"
repository = "https://github.com/chwzr/super"
description = "Full SUPER agent kernel for browser WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
js-sys = "0.3"
super-agent = { path = "../super-agent", default-features = false, features = ["portable"] }
super-ai = { package = "super-agent-ai", path = "../super-ai", default-features = false, features = [
  "portable",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "console"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
